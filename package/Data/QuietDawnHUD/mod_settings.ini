[Setting.logLevel]
Id = logLevel
Label = Logging
Group = Diagnostics
Description = How much this mod writes to UE4SS.log. Each level also includes the ones above it. Off writes nothing. Error reports only what the mod gave up on. Warning adds features that could not start while the rest kept working. Info adds notable moments during play. Debug adds per-event tracing and timing summaries, and is the only level that costs measurable performance. Warning is the default and matches what earlier versions printed.
Type = picker
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel
