[Mod]
Id = oOCamilleOo_QuietDawnHUD
Name = Quiet Dawn - Configurable HUD
Author = oOCamilleOo
Version = 1.1.3
AuthorURL = https://www.nexusmods.com/users/933214
LogoFile = assets/logo.png
Description = Change settings here. Apply to save and update the active game.

[Setting.enabled]
Id = enabled
Label = Enabled
Group = General
Description = Turn the whole mod on or off. Off restores the game's own HUD behaviour and hides every setting below.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = enabled

[Setting.hidePlayerCombatEffects]
Id = hidePlayerCombatEffects
Label = Hide player combat effects
Group = Player status: Active buffs
Description = Hide Crimson Rush's bright red arm effect in human and vampire form. Separate from effect icons and claw slash marks. Only the visual is hidden; buff strength and duration stay unchanged.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hidePlayerCombatEffects

[Setting.hidePlayerEffectIcons]
Id = hidePlayerEffectIcons
Label = Hide player effect icons
Group = Player status: Active buffs
Description = Hide player buff/debuff icons and their timers, including during Show HUD. Overrides Active buffs mode and opacity while On. Off resumes the saved panel settings. Effects and durations keep their game behavior.
Type = toggle
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = hidePlayerEffectIcons

[Setting.mode_WBP_BuffContainer]
Id = mode_WBP_BuffContainer
Label = Active buffs mode
Group = Player status: Active buffs
Description = How the active buff and debuff icons and their timers behave. Vanilla leaves their visibility to the game. Quiet Dawn hides them and reveals them only when it matters. Fixed opacity holds the level set by the slider below, where 0% keeps them hidden. Size is set separately and does not change with the mode.
Type = picker
PresetValues = 0|1|2
PresetLabels = Vanilla|Quiet Dawn|Fixed opacity
Default = 1
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = mode_WBP_BuffContainer

[Setting.opacity_WBP_BuffContainer]
Id = opacity_WBP_BuffContainer
Label = Active buffs opacity
Group = Player status: Active buffs
Description = How visible the active buff and debuff icons and their timers stay, from 0% to 100% in 5% steps. Used only in Fixed opacity mode. 0% keeps them hidden even during HUD peek and automatic reveals. The game still decides when they would normally be on screen.
Type = percent
VisibleWhen = mode_WBP_BuffContainer
VisibleValues = 2
Minimum = 0
Maximum = 100
Step = 5
Decimals = 0
Default = 0
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = opacity_WBP_BuffContainer
Suffix = %

[Setting.scale_WBP_BuffContainer]
Id = scale_WBP_BuffContainer
Label = Active buffs size
Group = Player status: Active buffs
Description = Size of the active buff and debuff icons and their timers, from 25% to 200% in 5% steps, independent of the mode. 100% is their original size. Edge panels grow inward and centered panels stay centered. Layout spacing never changes, so large sizes can overlap neighbouring elements.
Type = slider
Minimum = 25
Maximum = 200
Step = 5
Decimals = 0
Default = 100
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = scale_WBP_BuffContainer
Suffix = %

[Category.Player status: Active buffs]
VisibleWhen = enabled
VisibleValues = 1

