[Setting.logLevel]
Id = logLevel
Label = Logging
Group = Diagnostics
Description = How much this mod writes to UE4SS.log / Console. Each level also includes the ones above it. Off: Writes nothing. Error: Reports only what the mod gave up on. Warning: adds the logs of features that could not start while the rest kept working. Info: Adds notable moments during play. Debug: Adds extensive per-event tracing, timing summaries, and is the only level that costs measurable performance. Defaults to Warning.
Type = picker
PresetValues = 0|1|2|3|4
PresetLabels = Off|Error|Warning|Info|Debug
Default = 2
ConfigFile = settings.ini
ConfigSection = Settings
ConfigKey = logLevel
